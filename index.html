<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BOTCHAN 研修用デモページ</title>
<style>
  :root{--c1:#0b58f6;--c2:#10b981;--c3:#f59e0b;--c4:#ef4444;--bg:#f8fafc;--card:#fff;--line:#e5e7eb;--text:#0f172a;--muted:#475569;--primary:#000;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans JP',sans-serif;color:var(--text);background:var(--bg)}
  
  .level-nav { background: #1e293b; padding: 10px; display: flex; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 2000; }
  .level-btn { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .level-btn:hover { background: #475569; }
  .level-btn.active { background: var(--c1); box-shadow: 0 0 10px rgba(11,88,246,0.5); }

  header{padding:28px 20px;text-align:center;background:linear-gradient(120deg,#e6eeff,#f6f9ff);border-bottom:1px solid var(--line)}
  header h1{margin:0 0 8px;font-size:clamp(22px,4vw,32px)}
  .container{max-width:1100px;margin:0 auto;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 10px 26px rgb(15 23 42 / .05);}
  
  .grid{display:grid;gap:16px;grid-template-columns:1fr}
  @media(min-width:980px){.grid{grid-template-columns:380px 1fr}}
  
  .row{margin:18px 0}
  label{display:block;margin-bottom:6px;font-weight:700}
  .req::after{content:"必須"; color:#fff; background:#ef4444; font-size:10px; padding:2px 6px; border-radius:4px; margin-left:8px; vertical-align:middle; font-weight:bold;}
  input[type="text"],input[type="email"],input[type="tel"],select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #d1d5db;font-size:16px}
  
  .flex-row { display: flex; gap: 12px; }
  .flex-row > div { flex: 1; }
  .birth-row { display: flex; gap: 8px; align-items: center; }
  .radio-row { display: flex; gap: 20px; align-items: center; background: #f8fafc; padding: 12px; border-radius: 12px; border: 1px solid #e5e7eb; }
  .radio-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  .note{font-size:12px;color:#334155;background:#f1f5f9;border:1px dashed #cbd5e1;padding:12px;border-radius:8px;margin-bottom:15px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:12px;font-weight:800;cursor:pointer;border:0;color:#fff; transition: 0.2s;}
  .b1{background:var(--c1)} .b2{background:var(--c2)} .b3{background:var(--c3)} .b4{background:#64748b}
  
  .section-h{margin-top:28px;padding-top:12px;border-top:2px solid #f1f5f9;color:var(--text);font-weight:800; font-size: 18px;}
  .hidden{display:none}
  .confirm{background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;padding:20px; margin-top:20px;}
  .confirm h3 { margin-top:0; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .confirm dl{margin:0;display:grid;grid-template-columns:160px 1fr;gap:12px}
  .confirm dd{margin:0;font-weight:700; text-align: right;}
  
  .center-actions { display: flex; justify-content: center; margin-top: 24px; }

  /* モーダルのスタイル */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 3000; opacity: 0; visibility: hidden; transition: 0.3s; }
  .modal-overlay.show { opacity: 1; visibility: visible; }
  .modal-content { background: #fff; padding: 40px; border-radius: 20px; text-align: center; max-width: 450px; width: 90%; transform: translateY(-20px); transition: 0.3s; }
  .modal-overlay.show .modal-content { transform: translateY(0); }
  .modal-close { margin-top: 20px; background: #334155; color: #fff; padding: 10px 20px; border-radius: 10px; cursor: pointer; border: none; font-weight: bold; }
  .modal-title-error { color: var(--c4); }
  .modal-title-success { color: var(--c2); }
</style>
</head>
<body>

<nav class="level-nav">
  <button class="level-btn active" onclick="switchLevel(1)">レベル 1</button>
  <button class="level-btn" onclick="switchLevel(2)">レベル 2</button>
  <button class="level-btn" onclick="switchLevel(3)">レベル 3</button>
  <button class="level-btn" onclick="switchLevel(4)">レベル 4</button>
</nav>

<header>
  <h1>BOTCHAN デモ（研修：レベル <span id="current-level-display">1</span>）</h1>
</header>

<main class="container">
  
  <section id="level-1-area" class="card">
    <div class="contact">
      <h2 style="font-size: 2.5rem; margin-bottom: 20px;">Contact</h2>
      <form id="contact" novalidate="" action="javascript:void(0);">
        <p style="font-weight:bold;">事業内容ついてなどのお問い合わせは、下欄からどうぞ。</p>
        <div class="row">
          <label class="req" for="contact-variant">お問い合わせ種別</label>
          <select id="contact-variant" name="variant" form="contact" class="bg-gray-100" required>
            <option value="service" selected>サービスに関するお問い合わせ</option>
            <option value="recruit">採用に関するお問い合わせ</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="row">
          <label class="req" for="contact-name">お名前</label>
          <input id="contact-name" name="name" form="contact" placeholder="山田太郎" type="text" required>
        </div>
        <div class="row">
          <label class="req" for="contact-email">メールアドレス</label>
          <input id="contact-email" name="email" form="contact" placeholder="wevnal@co.jp" type="email" required>
        </div>
        <div class="row">
          <label class="req" for="contact-message">お問い合わせ内容</label>
          <textarea id="contact-message" name="message" form="contact" placeholder="お問合わせの詳細を入力してください。" rows="8" required></textarea>
        </div>
        <div style="display:flex; justify-content:center; padding:20px 0;">
          <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
            <input id="contact-agree" name="agree" form="contact" type="checkbox" required> 個人情報取り扱いに同意する
          </label>
        </div>
        <div class="center-actions">
          <button id="contact-submit" type="submit" style="background:#000; color:#fff; width:250px; height:56px; border-radius:28px; cursor:pointer; font-weight:bold;">送信する</button>
        </div>
      </form>
    </div>
  </section>

  <section id="level-other-area" class="grid hidden">
    <aside class="card">
      <h3>代理入力ツール</h3>
      <div id="condition-box" class="note">
        <b>【条件表】</b><br>
        ・EFO（買い切り）：1,980円<br>
        ・Payment（定期）：980円<br>
        ・送料：北海道/沖縄 1,980円 / 他 0円<br>
        ・手数料：代引/後払い 220円
      </div>
      <div id="btns-normal">
        <div class="row"><button id="fill-card-sub" class="btn b1" style="width:100%">クレカ/定期 で代理入力</button></div>
        <div class="row"><button id="fill-cod-one" class="btn b3" style="width:100%">代引/買い切り で代理入力</button></div>
      </div>
      <div id="btns-lv4" class="hidden">
        <div class="row"><button id="fill-lv4-ok" class="btn b1" style="width:100%">クレカ/定期（成功）</button></div>
        <div class="row"><button id="fill-lv4-age" class="btn b4" style="width:100%">NG：未成年(18歳)</button></div>
        <div class="row"><button id="fill-lv4-pw" class="btn b4" style="width:100%">NG：生年月日PW</button></div>
      </div>
    </aside>

    <article class="card">
      <h2>申込フォーム</h2>
      <form id="formMain" novalidate>
        <div class="row flex-row">
          <div><label for="lastName" class="req">姓</label><input id="lastName" name="lastName" type="text" placeholder="山田" required></div>
          <div><label for="firstName" class="req">名</label><input id="firstName" name="firstName" type="text" placeholder="太郎" required></div>
        </div>
        <div class="row flex-row">
          <div><label for="lastNameKana" class="req">セイ</label><input id="lastNameKana" name="lastNameKana" type="text" placeholder="ヤマダ" required></div>
          <div><label for="firstNameKana" class="req">メイ</label><input id="firstNameKana" name="firstNameKana" type="text" placeholder="タロウ" required></div>
        </div>

        <div class="row">
          <label for="gender" class="req">性別</label>
          <select id="gender" name="gender" required>
            <option value="male">男性</option>
            <option value="female">女性</option>
          </select>
        </div>

        <div class="row">
          <label class="req">生年月日</label>
          <div class="birth-row">
            <select id="birthYear" name="birthYear" required></select><span>年</span>
            <select id="birthMonth" name="birthMonth" required></select><span>月</span>
            <select id="birthDay" name="birthDay" required></select><span>日</span>
          </div>
        </div>

        <div class="row"><label for="email" class="req">メールアドレス</label><input id="email" name="email" type="email" required></div>
        <div class="row"><label for="tel" class="req">電話番号</label><input id="tel" name="tel" type="tel" required></div>
        <div class="row"><label for="password" class="req">パスワード</label><input id="password" name="password" type="text" required></div>

        <div class="row">
          <label for="zip" class="req">郵便番号</label>
          <input id="zip" name="zip" type="text" placeholder="1500013" style="width: 200px;" required>
        </div>
        <div class="row flex-row">
          <div><label for="pref" class="req">都道府県</label>
            <select id="pref" name="pref" required>
              <option value="" disabled selected>選択してください</option>
              <option value="北海道">北海道</option><option value="青森県">青森県</option><option value="岩手県">岩手県</option><option value="宮城県">宮城県</option><option value="秋田県">秋田県</option><option value="山形県">山形県</option><option value="福島県">福島県</option><option value="茨城県">茨城県</option><option value="栃木県">栃木県</option><option value="群馬県">群馬県</option><option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option><option value="東京都">東京都</option><option value="神奈川県">神奈川県</option><option value="新潟県">新潟県</option><option value="富山県">富山県</option><option value="石川県">石川県</option><option value="福井県">福井県</option><option value="山梨県">山梨県</option><option value="長野県">長野県</option><option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option><option value="愛知県">愛知県</option><option value="三重県">三重県</option><option value="滋賀県">滋賀県</option><option value="京都府">京都府</option><option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option><option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option><option value="鳥取県">鳥取県</option><option value="島根県">島根県</option><option value="岡山県">岡山県</option><option value="広島県">広島県</option><option value="山口県">山口県</option><option value="徳島県">徳島県</option><option value="香川県">香川県</option><option value="愛媛県">愛媛県</option><option value="高知県">高知県</option><option value="福岡県">福岡県</option><option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option><option value="熊本県">熊本県</option><option value="大分県">大分県</option><option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option><option value="沖縄県">沖縄県</option>
            </select>
          </div>
          <div style="flex: 2;"><label for="city" class="req">市区町村</label><input id="city" name="city" type="text" required></div>
        </div>
        <div class="row"><label for="addr1" class="req">番地・建物名</label><input id="addr1" name="addr1" type="text" required></div>
        
        <div class="section-h">商品選択</div>
        <div class="row">
          <label class="req" for="product">商品</label>
          <select id="product" name="product" required>
            <option value="not_regular">BOTCHAN EFO（買い切り）</option>
            <option value="regular">BOTCHAN Payment（定期商品）</option>
          </select>
        </div>
        
        <div class="section-h">支払い方法</div>
        <div class="row radio-row">
          <label class="radio-item"><input type="radio" name="payment" value="1" checked> クレカ</label>
          <label class="radio-item"><input type="radio" name="payment" value="3"> 代引</label>
          <label class="radio-item"><input type="radio" name="payment" value="2"> 後払い</label>
        </div>

        <div id="card-section" class="row" style="background: #f1f5f9; padding: 20px; border-radius: 16px;">
          <div class="row"><label class="req" for="cardNumber">カード番号</label><input id="cardNumber" name="cardNumber" type="text" placeholder="1234123412341234"></div>
          <div class="row flex-row">
            <div><label class="req">有効期限（月/年）</label>
              <div class="birth-row"><select id="expMonth" name="expMonth"></select><select id="expYear" name="expYear"></select></div>
            </div>
            <div><label class="req" for="cvc">CVC</label><input id="cvc" name="cvc" type="text" placeholder="123"></div>
          </div>
          <div class="row">
            <label id="save-cc-label" style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="checkbox" id="cc-save" name="cc-save"> クレジットカード情報を登録する
            </label>
          </div>
        </div>

        <div class="center-actions">
          <button id="btn-review" class="b1 btn" type="button">内容を確認する</button>
        </div>
        
        <div id="confirm-block" class="confirm hidden">
          <h3>内容の確認（税込）</h3>
          <dl>
            <dt>商品名：</dt><dd id="cf-name">-</dd>
            <dt>商品金額：</dt><dd id="cf-price">-</dd>
            <dt>送料：</dt><dd id="cf-ship">-</dd>
            <dt>手数料：</dt><dd id="cf-fee">-</dd>
            <dt>キャンペーン：</dt><dd id="cf-camp">-</dd>
            <dt style="font-size: 1.2rem; color: var(--c1);">合計金額：</dt>
            <dd id="cf-total" style="font-size: 1.5rem; color: var(--c1);">-</dd>
          </dl>
          <div class="center-actions">
            <button id="btn-submit" class="b2 btn" type="button">デモを申し込む</button>
          </div>
        </div>
      </form>
    </article>
  </section>
</main>

<div id="result-modal" class="modal-overlay">
  <div class="modal-content">
    <h2 id="modal-title">タイトル</h2>
    <p id="modal-message">メッセージがここに入ります。</p>
    <button class="modal-close" onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
let currentLevel = 1;

function switchLevel(lv) {
  currentLevel = lv;
  document.querySelectorAll('.level-btn').forEach((btn, i) => btn.classList.toggle('active', i + 1 === lv));
  document.getElementById('current-level-display').textContent = lv;
  document.getElementById('level-1-area').classList.toggle('hidden', lv !== 1);
  document.getElementById('level-other-area').classList.toggle('hidden', lv === 1);
  
  const cond = document.getElementById('condition-box');
  const bNormal = document.getElementById('btns-normal');
  const bLv4 = document.getElementById('btns-lv4');
  
  if(lv === 4) {
    cond.innerHTML = '<b>【Lv4 条件表】</b><br>・20歳未満購入不可<br>・PW: 3文字連続NG / 生年月日由来NG<br>・40歳以上割引：年齢×10円';
    bNormal.classList.add('hidden');
    bLv4.classList.remove('hidden');
  } else {
    cond.innerHTML = '<b>【条件表】</b><br>・EFO（買い切り）：1,980円<br>・Payment（定期）：980円<br>・送料：北海道/沖縄 1,980円 / 他 0円<br>・手数料：代引/後払い 220円';
    bNormal.classList.remove('hidden');
    bLv4.classList.add('hidden');
  }
}

function setValue(el, val) {
  if (!el) return;
  el.value = val;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}

function showModal(title, message, type) {
  const modalTitle = document.getElementById('modal-title');
  const modalMsg = document.getElementById('modal-message');
  modalTitle.textContent = title;
  modalMsg.innerHTML = message;
  modalTitle.className = (type === 'error') ? 'modal-title-error' : 'modal-title-success';
  document.getElementById('result-modal').classList.add('show');
}
function closeModal() {
  document.getElementById('result-modal').classList.remove('show');
}

(function(){
  const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
  const cy = new Date().getFullYear();

  // 初期設定
  for(let y=cy; y>=cy-80; y--) if($('#birthYear')) $('#birthYear').add(new Option(y,y));
  for(let m=1; m<=12; m++) {
    const ms = String(m).padStart(2,'0');
    if($('#birthMonth')) $('#birthMonth').add(new Option(ms,ms));
    if($('#expMonth')) $('#expMonth').add(new Option(ms,ms));
  }
  for(let d=1; d<=31; d++) if($('#birthDay')) $('#birthDay').add(new Option(String(d).padStart(2,'0'),String(d).padStart(2,'0')));
  for(let y=0; y<10; y++) if($('#expYear')) $('#expYear').add(new Option(cy+y,cy+y));

  const updateCCLogic = () => {
    const isRegular = $('#product').value === 'regular';
    const ccSave = $('#cc-save');
    const label = $('#save-cc-label');
    if(isRegular) {
      ccSave.checked = true;
      ccSave.required = true;
      ccSave.onclick = function() { return false; }; 
      label.classList.add('req');
    } else {
      ccSave.required = false;
      ccSave.onclick = null;
      label.classList.remove('req');
    }
  };

  if($('#product')) $('#product').addEventListener('change', updateCCLogic);
  updateCCLogic();

  // レベル4限定厳格バリデーション
  function validateLevel4() {
    if(currentLevel !== 4) return [];
    let errs = [];
    const age = cy - parseInt($('#birthYear').value);
    if(age < 20) errs.push("【Lv4制限】20歳未満の方は購入できません。");
    const pw = $('#password').value;
    if(/(.)\1\1/.test(pw)) errs.push("【Lv4制限】パスワードに同一文字を3回以上連続させることはできません。");
    const y=$('#birthYear').value, md=$('#birthMonth').value+$('#birthDay').value, ymd=y+md;
    if(pw.includes(y) || pw.includes(md) || pw.includes(ymd)) errs.push("【Lv4制限】生年月日を含むパスワードは使用できません。");
    return errs;
  }

  // レベル1 バリデーション
  if($('#contact')) $('#contact').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!$('#contact-name').value || !$('#contact-email').value || !$('#contact-message').value || !$('#contact-agree').checked) {
      showModal("入力エラー", "未入力の項目、または規約への同意が必要です。", "error");
    } else {
      showModal("申込完了", "お問い合わせ内容を受け付けました。", "success");
    }
  });

  // レベル2〜4 共通申し込みロジック
  if($('#btn-submit')) $('#btn-submit').addEventListener('click', () => {
    const isRegular = $('#product').value === 'regular';
    const payment = $('input[name="payment"]:checked').value;
    const fields = [$('#lastName').value, $('#firstName').value, $('#lastNameKana').value, $('#firstNameKana').value, $('#email').value, $('#tel').value, $('#password').value, $('#zip').value, $('#city').value, $('#addr1').value];
    let ccValid = true;
    if (payment === '1') {
      if (!$('#cardNumber').value || !$('#cvc').value) ccValid = false;
      if (isRegular && !$('#cc-save').checked) ccValid = false;
    }
    if (fields.some(v => !v) || !ccValid) {
      showModal("入力エラー", "必須項目が未入力、または規約に同意していません。", "error");
    } else {
      showModal("申込完了", "お申し込み内容を受け付けました。", "success");
    }
  });

  // 内容確認ロジック（Lv4のみ割引適用）
  if($('#btn-review')) $('#btn-review').addEventListener('click', () => {
    const lv4Errs = validateLevel4();
    if(lv4Errs.length > 0) {
      showModal("入力エラー", lv4Errs.join('<br>'), "error");
      return;
    }
    const isRegular = $('#product').value === 'regular';
    const basePrice = isRegular ? 980 : 1980;
    const pref = $('#pref').value;
    const shipFee = (pref === '北海道' || pref === '沖縄県') ? 1980 : 0;
    const payFee = ($('input[name="payment"]:checked').value === '1') ? 0 : 220;
    const age = cy - parseInt($('#birthYear').value);
    const campDiscount = (currentLevel === 4 && age >= 40) ? -(age * 10) : 0;

    $('#cf-name').textContent = isRegular ? "BOTCHAN Payment（定期）" : "BOTCHAN EFO（買い切り）";
    $('#cf-price').textContent = basePrice.toLocaleString() + "円";
    $('#cf-ship').textContent = shipFee.toLocaleString() + "円";
    $('#cf-fee').textContent = payFee.toLocaleString() + "円";
    $('#cf-camp').textContent = campDiscount.toLocaleString() + "円";
    $('#cf-total').textContent = (basePrice + shipFee + payFee + campDiscount).toLocaleString() + "円";
    $('#confirm-block').classList.remove('hidden');
  });

  // レベル2,3用代理入力
  if($('#fill-card-sub')) $('#fill-card-sub').addEventListener('click', () => {
    setValue($('#lastName'), "山田"); setValue($('#firstName'), "太郎");
    setValue($('#lastNameKana'), "ヤマダ"); setValue($('#firstNameKana'), "タロウ");
    setValue($('#email'), "test@example.co.jp"); setValue($('#tel'), "0354496477");
    setValue($('#password'), "test1234"); setValue($('#zip'), "1500013");
    setValue($('#pref'), "東京都"); setValue($('#city'), "渋谷区恵比寿"); setValue($('#addr1'), "1-23-23");
    setValue($('#product'), "regular"); updateCCLogic();
  });
  if($('#fill-cod-one')) $('#fill-cod-one').addEventListener('click', () => {
    setValue($('#lastName'), "山田"); setValue($('#firstName'), "花子"); setValue($('#pref'), "沖縄県");
    setValue($('#product'), "not_regular"); $('input[name="payment"][value="3"]').checked = true;
    updateCCLogic(); $('#card-section').classList.add('hidden');
  });

  // レベル4専用代理入力
  $('#fill-lv4-ok').addEventListener('click', () => {
    setValue($('#lastName'), "山下"); setValue($('#firstName'), "Lv4");
    setValue($('#birthYear'), "1980"); setValue($('#password'), "validPass99");
    setValue($('#product'), "regular"); setValue($('#pref'), "東京都"); updateCCLogic();
  });
  $('#fill-lv4-age').addEventListener('click', () => { setValue($('#birthYear'), String(cy - 18)); });
  $('#fill-lv4-pw').addEventListener('click', () => {
    setValue($('#birthYear'), "1995"); setValue($('#birthMonth'), "05"); setValue($('#birthDay'), "05");
    setValue($('#password'), "19950505");
  });

  $$('input[name="payment"]').forEach(r => r.addEventListener('change', e => {
    $('#card-section').classList.toggle('hidden', e.target.value !== '1');
  }));

  // URLパラメータ level= による自動初期化
  window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    const levelParam = params.get('level');
    if (levelParam) {
      const lv = parseInt(levelParam);
      if (lv >= 1 && lv <= 4) {
        switchLevel(lv);
      }
    }
  });

})();
</script>
</body>
</html>
